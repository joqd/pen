services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - ./media:/app/media
    networks:
      - shared_net

networks:
  shared_net:
    name: shared_net
    external: true
