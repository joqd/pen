# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GREETING: Hello, world!

tasks:
  run:
    desc: Run development server + celery beat together (Ctrl+C stops both)
    deps:
      - dev-server
      - celery-dev
    silent: true

  dev-server:
    internal: true
    cmds:
      - uv run python manage.py runserver localhost:8000
    silent: true

  format:
    desc: Format using ruff
    cmds:
      - uv run ruff format .
    silent: true

  fix:
    desc: Fix lint issues using ruff
    cmds:
      - uv run ruff check . --fix
      - uv run ruff format .
    silent: true

  lint:
    desc: Lint using ruff
    cmds:
      - uv run ruff check .
    silent: true

  export-deps:
    desc: Export dependencies in requirements-txt
    cmds:
      - uv export --format requirements-txt --no-hashes -o requirements.txt
    silent: true

  celery-worker:
    desc: Run celery worker (development)
    cmds:
      - uv run celery -A program worker --loglevel=info
    silent: true

  celery-beat:
    desc: Run celery beat scheduler (development)
    cmds:
      - uv run celery -A program beat --loglevel=info
    silent: true

  celery-dev:
    desc: Run worker + beat together in one process (dev convenience only, not for production)
    cmds:
      - uv run celery -A program worker --beat --loglevel=info
    silent: true

  flower:
    desc: Run Flower dashboard to monitor celery tasks/queues
    cmds:
      - uv run celery -A program flower --port=5555
    silent: true